<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>InputController</title>
</head>
<body>    
    <script src="input-controller.js"></script>
    <script>
        const myController = new InputController(
            { "testAction": { keys: [65], enabled: true } }, 
            document
        );

        console.log("После создания:", myController.actions);

        myController.bindActions({
            "left": { keys: [37, 65] }, 
            "jump": { keys: [32], enabled: true }
        });
        
        console.log("После добавления:", myController.actions);
        
    </script>
</body>
</html>
